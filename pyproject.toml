[project]
name = "vision-to-edge"
version = "0.1.0"
description = "Vision model training (YOLO, DETR, BEVFormer) and edge deployment"
requires-python = ">=3.12"
dependencies = [
    # Deep learning
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    # CLI
    "typer[all]>=0.15.0",
    # Model building blocks
    "einops>=0.8.0",
    "timm>=1.0.0",
    # ONNX export + local validation
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    # Data / numerics
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0.0",
    # Evaluation (COCO metrics for YOLO/DETR)
    "pycocotools>=2.0.8",
    # Logging / progress
    "rich>=13.0.0",
    "tqdm>=4.67.0",
    "wandb>=0.28.0",
]

# nuscenes-devkit is intentionally excluded from managed deps:
# it pins matplotlib<3.6 and numpy<2, conflicting with the rest of the stack.
# Install it in an isolated env when needed:
#   uv run --with nuscenes-devkit python ...

# ── PyTorch CUDA source ────────────────────────────────────────────────────────
[tool.uv.sources]
torch      = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name     = "pytorch-cu128"
url      = "https://download.pytorch.org/whl/cu128"
explicit = true   # only torch/torchvision/torchaudio are fetched from here

# ── Build backend ─────────────────────────────────────────────────────────────
[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["training"]
